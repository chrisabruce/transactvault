# Local development stack — app + SurrealDB + RustFS, all on one machine.
#
# This file is DEV ONLY. Production runs the app from the root `Dockerfile`
# as a single container and points it at a SurrealDB and an S3-compatible
# store that are managed independently (see DEPLOY.md). Nothing here is
# expected to be deployed anywhere.
#
#   docker compose up --build              # whole stack
#   docker compose up -d surrealdb rustfs  # backing services, then `cargo run`
#
# Host ports are deliberately unusual (3742x) so the stack coexists with
# other local dockers. They bind 127.0.0.1 rather than 0.0.0.0 so a laptop
# on a café network isn't serving a root-credentialled database to the
# room; override APP_BIND to reach the app from a phone on your LAN.
services:
  surrealdb:
    # Pinned exactly — a database on a floating tag silently jumps
    # versions on every pull. Bump deliberately (in-major v3.x upgrades
    # are data-compatible; export first anyway).
    image: surrealdb/surrealdb:v3.2.3
    restart: unless-stopped
    # Run as root in the container. The `surrealdb` image's non-root default
    # collides with named-volume ownership on some Docker hosts — root always
    # has write permission on /data. The container is the isolation boundary,
    # not the in-container UID, so this is safe for a dev stack.
    user: "0:0"
    # SurrealDB reads SURREAL_USER / SURREAL_PASS from its own container env
    # as fallbacks for the --user / --pass flags. Putting them in
    # `environment:` means they travel with the container regardless of how
    # the compose orchestrator handles ${...} substitution at up-time.
    environment:
      SURREAL_USER: ${SURREAL_USER:-root}
      SURREAL_PASS: ${SURREAL_PASS:-root}
    command:
      - start
      - --bind=0.0.0.0:8000
      - rocksdb:///data/tv.db
    # Published so a native `cargo run` reaches it at the address `.env`
    # already points at (ws://127.0.0.1:37422).
    ports:
      - "127.0.0.1:${SURREAL_HOST_PORT:-37422}:8000"
    volumes:
      - surreal-data:/data

  rustfs:
    # Pinned exactly (was `:latest`, which had drifted from
    # 1.0.0-alpha.83 to the beta series). Boot + bucket-create verified
    # against the app's storage layer on 2026-07-25. If rustfs fails to
    # start after a version bump over an old data volume, wipe the
    # local `rustfs-data` volume — dev objects are disposable.
    image: rustfs/rustfs:1.0.0-beta.11
    restart: unless-stopped
    # Same reasoning as surrealdb — sidestep the host-volume UID clash.
    user: "0:0"
    environment:
      # beta.11 still reads *_ACCESS_KEY / *_SECRET_KEY (verified) —
      # the older *_ROOT_USER / *_ROOT_PASSWORD env vars are silently
      # ignored and the server falls back to the default admin creds.
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      - "127.0.0.1:${RUSTFS_HOST_PORT:-37421}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-37423}:9001"
    volumes:
      - rustfs-data:/data
    # No healthcheck — the rustfs image is minimal (no curl/wget) so probes
    # are brittle. The app has its own retry-on-any-error loop for the S3
    # warmup in src/storage.rs, which handles the "rustfs TCP is up but the
    # IAM subsystem isn't quite ready" race.

  transactvault:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - surrealdb
      - rustfs
    restart: unless-stopped
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_HOST_PORT:-37420}:37420"
    environment:
      # Server
      APP_NAME: ${APP_NAME:-TransactVault}
      BASE_URL: ${BASE_URL:-http://localhost:37420}
      HOST: 0.0.0.0
      PORT: "37420"
      # Human-readable logs by default; hunting one ERROR line inside JSON
      # blobs is miserable. Keep RUST_LOG scoped — a bare `debug` drowns
      # real errors under rustls/h2 TLS chatter.
      PRETTY_LOGS: ${PRETTY_LOGS:-true}
      RUST_LOG: ${RUST_LOG:-info,transactvault=debug}

      # Service DNS on the compose network, NOT the published host ports —
      # container-to-container traffic never leaves Docker.
      SURREAL_URL: ws://surrealdb:8000
      SURREAL_USER: ${SURREAL_USER:-root}
      SURREAL_PASS: ${SURREAL_PASS:-root}
      SURREAL_NS: ${SURREAL_NS:-transactvault}
      SURREAL_DB: ${SURREAL_DB:-app}

      # Object storage. Production sets these same S3_* names against a
      # managed provider; here they point at the local rustfs container.
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-transactvault}
      # rustfs starts with no bucket at all, so dev must create it.
      S3_AUTO_CREATE_BUCKET: "true"

      # Auth
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-168}
      # Password-reset links are bearer credentials — keep the window short.
      RESET_EXPIRY_HOURS: ${RESET_EXPIRY_HOURS:-1}
      # No reverse proxy in front of the dev stack, so the socket peer IS
      # the client. Any higher value would trust a spoofable header.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}

      # Postmark. An empty token means messages are logged rather than
      # delivered — signup verification, invitations and password-reset
      # links all print to the log, which is the intended dev behaviour.
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      POSTMARK_FROM: ${POSTMARK_FROM:-TransactVault <no-reply@transactvault.example>}
      POSTMARK_REPLY_TO: ${POSTMARK_REPLY_TO:-}
      POSTMARK_MESSAGE_STREAM: ${POSTMARK_MESSAGE_STREAM:-outbound}

volumes:
  surreal-data:
  rustfs-data:
